name: release-please

# Versioning, changelog AND the deploy handoff. Maintains a release PR from
# Conventional Commits on every push to main; when that PR merges, the
# release is cut as a DRAFT, published by the second job, and deploy.yml is
# dispatched explicitly for the new tag.
#
# The dispatch is REQUIRED, not a convenience: releases published with the
# default GITHUB_TOKEN never trigger other workflows (GitHub's recursion
# guard), so deploy.yml's release trigger cannot fire from here on its own.
#
# Why a draft first: with immutable releases enabled, a published release's
# assets and tag cannot change, so anything that must be attached to a
# release (a manifest, an SBOM) has to go on while it is still a draft. Add
# such a job between release-please and publish-release, checking out
# `sha` (a draft release has no git tag yet), and keep publish-release
# independent of it with `!cancelled()`.
#
# The next release PR is recomputed after publishing: release-please opens
# it inside the draft window, before the tag exists, so its version and
# changelog are computed as though nothing had been released. The last step
# of publish-release re-runs this workflow once the tag exists.
#
# CHANGELOG.md is generated by this workflow; never hand-edit it.

on:
  push:
    branches:
      - main
  # Dispatched by publish-release to recompute the next release PR once the
  # tag exists. Cannot loop: a dispatched run has no newly merged release
  # PR, so release_created is false and publish-release skips.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatching deploy.yml on release creation

jobs:
  release-please:
    # Only the application's own repository releases and deploys: never the
    # template it came from, and never a fork. Filled in by init.
    if: github.repository == '{{GITHUB_OWNER}}/{{GITHUB_REPO}}'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: publish the release and dispatch deploy
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      # Publishing is what creates the git tag.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --repo "${{ github.repository }}" --draft=false
          echo "Published ${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"

      # Runs after the publish because the tag does not exist until then.
      - name: Dispatch deploy for the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f ref="${{ needs.release-please.outputs.tag_name }}"

      # Best-effort and last: the release has shipped by now, and the next
      # push to main corrects a stale release PR anyway.
      - name: Recompute the next release pull request now the tag exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-please.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched release-please to recompute the next release PR against ${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
